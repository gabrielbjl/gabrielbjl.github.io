<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>
  <link rel="stylesheet" href="style.css"> <!-- Estilos -->
  <script defer src="script.js"></script> <!-- Script para lógica do formulário -->
</head>

<body>
  <!-- Menu de navegação -->
  <header>
    <nav class="menu">
      <ul>
        <li><a href="index.html">Sobre mim</a></li>
        <li><a href="formacao.html">Formação</a></li>
        <li><a href="portfolio.html">Portfólio</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Seção de contato com formulário -->
    <section class="contato">
      <h1>Contato</h1>
      <form id="formContato">
        <!-- Campo para nome -->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <!-- Campo para e-mail -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <!-- Campo para mensagem -->
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <!-- Botão de envio -->
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>© 2025 - Gabriel Barbosa J. de Lima</p>
  </footer>
</body>

</html>
